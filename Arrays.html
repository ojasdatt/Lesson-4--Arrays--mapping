<html>
    <head>
        <title>
            Array sort
        </title>
    </head>
    <body>
        <p>Click the button to sort arrays in acending order.</p>
        <button onclick="ascending()">+</button>
        <button onclick="descending()">-</button>
        <p id="result"></p>
        <script>
            var points = [40,100,1,889,25,6];
            document.getElementById("result").innerHTML = points;
            function ascending() {
                points.sort(function(a,b){return a - b});
                document.getElementById("result").innerHTML = points;
            }
            function descending() {
                points.sort(function(a,b){return b - a});
                document.getElementById("result").innerHTML = points;
            }
        </script>
    </body>
</html>
